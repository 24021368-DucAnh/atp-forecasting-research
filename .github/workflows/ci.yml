name: ATP Lab CI

on:
  push:
    branches: [main]
  # Review stacked PRs against their real feature-base, not only main.
  pull_request: {}

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/${{ matrix.os }}-py${{ matrix.python-version }}.txt

      - name: Install package and test/ML dependencies
        run: |
          python -m pip install --no-deps -r "requirements/${{ matrix.os }}-py${{ matrix.python-version }}.txt"
          python -m pip install --no-deps -e ".[test,ml]"
          python -m pip check

      - name: Verify canonical tracked-file SHA256 manifest
        run: python -m scripts.repository_manifest verify

      - name: Run complete automated test suite
        run: python -m pytest -q

      - name: Check safe default gate
        run: python -m atp_gate evaluate examples/synthetic_unvalidated.json

      - name: Smoke-test historical synthetic data audit
        run: python -m atp_gate research-audit examples/research_synthetic.csv
