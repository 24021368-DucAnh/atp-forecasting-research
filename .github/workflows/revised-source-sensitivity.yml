name: Revised source sensitivity (research)
on:
  push:
    branches: [research/p1-p2-revised-source-sensitivity]
    paths:
      - '.github/workflows/revised-source-sensitivity.yml'
      - 'scripts/revised_source_sensitivity.py'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test,ml]"
      - run: python -m pytest -q
      - run: python -m scripts.revised_source_sensitivity
