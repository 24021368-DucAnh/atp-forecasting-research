name: P1.9b parser impact
on:
  push:
    branches: [repair/p1-9b-green]
    paths:
      - '.github/workflows/p1-9b-parser-impact.yml'
      - 'scripts/p1_9b_parser_impact.py'
      - 'src/atp_gate/tml_elo_experiment.py'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test,ml]"
      - run: git fetch origin 2e084eedfc44c8ffaabd1fc5cbfb00769b703574
      - run: python -m scripts.p1_9b_parser_impact
