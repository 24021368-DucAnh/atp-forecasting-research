name: P1.8a pinned identity diagnostics
on:
  push:
    branches: [research/p1-8-identity-completeness]
    paths:
      - '.github/workflows/p1-8a-identity-research.yml'
      - 'scripts/p1_8a_identity_research.py'
      - 'src/atp_gate/tml_identity_audit.py'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test,ml]"
      - run: python -m scripts.p1_8a_identity_research
