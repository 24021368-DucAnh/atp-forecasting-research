[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-selective-gate"
version = "0.2.1"
description = "Strict ATP paper forecast gate and honest chronological research pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.4", "portalocker==4.4.2", "tzdata==2026.6; platform_system == 'Windows'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ml = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "xgboost>=2.0,<4", "openpyxl>=3.1,<4"]
dashboard = ["streamlit==1.67.0", "pandas==2.3.3"]

[project.scripts]
atp-lab = "atp_lab.worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
